[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-tui"
version = "1.0.0"
description = "Android Terminal User Interface for ADB File System Management"
readme = "README.md"
authors = [{ name = "AndroidTUI" }]
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
atui = "android_tui.app:main"
android-tui = "android_tui.app:main"
androidtui = "android_tui.app:main"
