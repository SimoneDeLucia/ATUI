name: Build and Release MSI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version and Tag
        id: version_step
        shell: powershell
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            $ver = $tag.TrimStart("v")
          } else {
            $ver = (python -c "import android_tui; print(android_tui.__version__)").Trim()
            $tag = "v$ver"
          }
          Write-Host "Detected version: $ver, tag: $tag"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build MSI Installer
        shell: powershell
        run: |
          & "installer/build_installer.ps1" -PythonExe (Get-Command python).Source

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "AndroidTUI ${{ steps.version_step.outputs.tag }} - Windows Installer Release"
          make_latest: true
          body: |
            ## AndroidTUI ${{ steps.version_step.outputs.tag }} - Release Ufficiale

            Pacchetto d'installazione Windows (.msi) aggiornato automaticamente.

            ### Caratteristiche del pacchetto:
            - **AndroidTUI-Setup.msi**: Installer autonomo con registrazione nel PATH, collegamenti Desktop e Menu Avvio.
            - Driver Google ADB USB ufficiali inclusi con installazione via `pnputil`.
            - Google Platform-Tools (`adb.exe`) inclusi.
            - Integrazione completa con `scrcpy` e gestione multi-device ADB.

            ### Installazione rapida da PowerShell (One-liner):
            ```powershell
            irm https://raw.githubusercontent.com/SimoneDeLucia/ATUI/main/installer/install.ps1 | iex
            ```
          draft: false
          prerelease: false
          files: |
            installer/dist/AndroidTUI-Setup.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
